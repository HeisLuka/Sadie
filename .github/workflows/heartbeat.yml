name: Actions Heartbeat

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - ".github/workflows/heartbeat.yml"

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write heartbeat
        run: |
          mkdir -p reports
          cat > reports/actions-heartbeat.json <<EOF
          {
            "status": "actions-running",
            "source_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "repository": "${GITHUB_REPOSITORY}"
          }
          EOF
          git config user.name "sadie-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/actions-heartbeat.json
          git commit -m "chore: actions heartbeat [skip ci]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
