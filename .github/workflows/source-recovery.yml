name: Sadie Source Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - "queue/recovery_queue.json"
      - "scripts/recover.py"
      - ".github/workflows/source-recovery.yml"
  pull_request:
    paths:
      - "queue/recovery_queue.json"
      - "scripts/recover.py"
      - ".github/workflows/source-recovery.yml"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full poppler-utils tesseract-ocr ffmpeg file
          python -m pip install --upgrade yt-dlp

      - name: Run recovery queue
        run: python scripts/recover.py

      - name: Build compact manifest
        if: always()
        run: |
          find recovery -maxdepth 2 -type f -printf '%p %s bytes\n' | sort > recovery/MANIFEST.txt || true

      - name: Upload recovered objects and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sadie-source-recovery
          path: recovery/
          if-no-files-found: warn
          retention-days: 30
